version: '3.8'

services:
  database:
    image: postgres:17-alpine
    container_name: thcs_dong_quang_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thcs_dong_quang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
